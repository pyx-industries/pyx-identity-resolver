name: Docker

# Pipeline behaviour:
#  - Push to `master` (paths-based): builds and pushes `:master` and
#    `:master-<sha>` images (plus matching `-serverless` variants).
#    Use for tracking the trunk's latest state.
#  - Push of a `v*` tag (e.g. `v4.0.1`): builds and pushes the
#    semver-tagged image plus its `-serverless` counterpart, and nothing
#    else. This is a maintenance line behind a newer release, so it never
#    moves `:latest` or `:latest-serverless`; the newest line owns them.
#  - `workflow_dispatch` with a `version` input: same as a tag push but
#    triggered manually.
#  - A tag or `version` input that is not MAJOR.MINOR.PATCH fails the run
#    before any image is tagged.
#
# See: documentation/docs/contributing/release-process.md for the full
# release workflow.

on:
  push:
    branches:
      - master
    paths:
      - 'app/src/**'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'Dockerfile'
      - 'Dockerfile.serverless'
      - 'docker-compose.yaml'
      - 'version.json'
      - '.github/workflows/docker.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to tag this build with (e.g. 4.0.0). Omit to push only the branch tag.'
        required: false
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository_owner == 'pyx-industries'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard image: served by Node, used for container/VM/K8s
          # deployments.
          - variant: standard
            dockerfile: Dockerfile
            suffix: ''
          # Serverless image: used for AWS Lambda container deployments.
          - variant: serverless
            dockerfile: Dockerfile.serverless
            suffix: '-serverless'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the SHA that triggered the workflow so a parallel push
          # to master (or a re-tag) cannot move the working tree under us.
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every tag this line publishes is a full MAJOR.MINOR.PATCH version.
      # Refuse anything else before it can become an image tag, so neither a
      # `v*` tag such as `vlatest` nor a dispatch input such as `latest` or
      # `master` can overwrite a floating tag that the newest line owns.
      - name: Check the release version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          check() {
            if [[ ! "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$2 is not a MAJOR.MINOR.PATCH version"
              exit 1
            fi
          }
          if [[ "$REF_TYPE" == "tag" ]]; then
            check "${REF_NAME#v}" "Tag version"
          fi
          if [[ -n "$INPUT_VERSION" ]]; then
            check "$INPUT_VERSION" "Input version"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `suffix` is appended to every tag so the standard image
          # gets unsuffixed tags (`4.0.1`) and the serverless image gets
          # `-serverless`-suffixed tags (`4.0.1-serverless`).
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=master-,enable=${{ github.ref == 'refs/heads/master' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
